name: CI
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  actions: none

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          cache: 'pip'
      - name: install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnss-db libdb-dev libcurl4-gnutls-dev libgnutls28-dev libldap2-dev libsasl2-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-github-actions-annotate-failures
      - name: Test
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p test-results
          if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
             echo "${PR_HEAD_SHA}" > test-results/sha-number
          else
             echo "${GITHUB_SHA}" > test-results/sha-number
          fi
          pytest -v --durations=0 --junitxml=test-results/junit.xml --cov=nss_cache
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: always()
      - name: Install
        run: pip install --user .
      - name: slapd Regression Test
        run: |
          sudo apt-get install -y slapd ldap-utils libnss-db db-util
          tests/slapd-regtest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: test-results
          path: test-results/
      - name: pylint
        run: |
          pip install pylint
          pylint nsscache nss_cache
        continue-on-error: true
